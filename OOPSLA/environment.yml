# OOPSLA artifact — reproducible conda environment
#
# Pins the reference environment for release checks. Historical result files
# record other environments as well; see ../REPRODUCIBILITY.md.
#
#     conda env create -f environment.yml
#     conda activate oopsla-quits
#
# The interpreter version is pinned because the artifact pins behaviour of the
# `ast` module (used by experiments/quant_evidence.py) and of set/frozenset
# ordering in the JSON dumps; both are stable across 3.11 patch releases but
# not guaranteed across minor versions.
#
# On the reference machine (Windows) the equivalent pip environment is
# `requirements-lock.txt` (conda/pip wheels share versions here).

name: oopsla-quits

channels:
  - conda-forge

dependencies:
  - python=3.11.17

  # --- python infrastructure -------------------------------------------------
  - pip=26.2.1
  - setuptools=83.0.0
  - wheel=0.47.0
  - pytest=9.1.1          # the whole test suite is pytest-based

  # --- numerical core --------------------------------------------------------
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=3.0.6
  - networkx=3.6.1

  # --- QUITS' runtime dependencies (see third_party/quits-<sha>/pyproject.toml) -
  # Source measurements use the read-only pinned tree under ../../third_party/.
  # The pip subsection also installs the wheel for the source/wheel comparison.
  - stim=1.16.0
  - ldpc=2.4.1
  - qldpc=0.4.1
  - matplotlib=3.11.2
  - qdldl=0.1.9.post1
  - sparsediffpy=0.6.1
  - sinter=1.16.0
  - pymatching=2.4.0

  # --- QUITS' own heavier optional stack (imported lazily by qldpc_code/*) ---
  # These are not required by any experiment in this artifact; they are listed
  # so that `conda env create` reproduces the reference environment exactly and
  # so that `import quits.<anything>` cannot fail for an unrelated reason.
  - galois=0.4.11
  - numba=0.68.0
  - llvmlite=0.50.0
  - cvxpy=1.9.3
  - osqp=1.1.3
  - clarabel=0.11.1
  - scs=3.3.1
  - highspy=1.15.1
  - pulp=3.3.2

  # --- misc runtime deps pulled by the above ---------------------------------
  - cython=3.1
  - contourpy=1.3.3
  - cycler=0.12.1
  - fonttools=4.66.1
  - joblib=1.6.0
  - kiwisolver=1.5.1
  - packaging=26.3
  - pillow=12.3.0
  - pluggy=1.6.0
  - pyparsing=3.3.3
  - sympy=1.14.0
  - tqdm=4.70.1
  - python-dateutil=2.9.0.post0
  - six=1.17.0
  - typing_extensions=4.16.0
  - tzdata=2026.5
  - pip:
      - quits==1.2.0
      - beliefmatching==0.1.1
